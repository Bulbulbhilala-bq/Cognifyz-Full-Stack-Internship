<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Student Portal</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#register">Register</a>
            <a href="#students">Students</a>
        </nav>
    </header>
    <main>
        <section id="home" class="page">
            <h2>Welcome to Student Portal</h2>
            <p>Register yourself and manage student information.</p>
            <button onclick="navigateTo('register')">
                Get Started
            </button>
        </section>
        <section id="register" class="page" hidden>
            <h2>Student Registration</h2>

            <form id="registrationForm">

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
                <small id="nameError"></small>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
                <small id="emailError"></small>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create password">
                <small id="passwordStrength"></small>
                <small id="passwordError"></small>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
                <small id="confirmPasswordError"></small>

                <label>
                    <input type="checkbox" id="terms">
                    I agree to the terms and conditions.
                </label>
                <small id="termsError"></small>

                <button type="submit">Register</button>

            </form>

            <p id="successMessage"></p>
        </section>
        <section id="students" class="page" hidden>
            <h2>Registered Students</h2>
            <div id="studentList">
                <p>No students registered yet.</p>
            </div>
        </section>

    </main>
    <script src="script.js"></script>
</body>
</html>
